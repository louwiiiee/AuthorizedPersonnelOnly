<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Surprise 🎂</title>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }

    #start h1 {
      font-size: 70px;
      margin: 10px;
    }

    #start p {
      font-size: 22px;
    }

    #message {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
      pointer-events: none;
      background: rgba(0,0,0,0.15);
    }

    #countdown {
      font-size: 35vw;
      font-weight: bold;
      text-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    #birthday {
      display: none;
    }

    #birthday h1 {
      font-size: 11vw;
      margin: 0;
    }

    #birthday p {
      font-size: 5vw;
    }

    .confetti {
      position: fixed;
      top: -30px;
      font-size: 30px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <!-- User must tap first so the browser allows audio -->
  <div id="start">
    <h1>🎂</h1>
    <p><strong>Birthday Surprise</strong></p>
    <p>Tap to open the camera 👆</p>
  </div>

  <!-- Countdown / birthday message -->
  <div id="message">

    <div id="countdown">10</div>

    <div id="birthday">
      <h1>🎉 HAPPY BIRTHDAY! 🎉</h1>
      <p>🎂 Have an amazing day! 🎈</p>
    </div>

  </div>

  <audio id="song" src="birthday.mp3"></audio>

  <script type="module">

    const startScreen = document.getElementById("start");
    const message = document.getElementById("message");
    const countdown = document.getElementById("countdown");
    const birthday = document.getElementById("birthday");
    const song = document.getElementById("song");

    let surpriseStarted = false;

    startScreen.addEventListener("click", async () => {

      startScreen.style.display = "none";

      // Start camera
      const mindarThree = new MindAR.IMAGE.MindARThree({
        container: document.body,

        imageTargetSrc: "./targets.mind",

        maxTrack: 1
      });

      const { renderer, scene, camera } = mindarThree;

      // Create an invisible AR anchor
      const anchor = mindarThree.addAnchor(0);

      anchor.onTargetFound = () => {

        if (!surpriseStarted) {

          surpriseStarted = true;

          startCountdown();

        }

      };

      await mindarThree.start();

      renderer.setAnimationLoop(() => {

        renderer.render(scene, camera);

      });

    });


    function startCountdown() {

      message.style.display = "flex";

      let number = 10;

      countdown.textContent = number;

      const timer = setInterval(() => {

        number--;

        if (number > 0) {

          countdown.textContent = number;

        } else {

          clearInterval(timer);

          countdown.style.display = "none";

          birthday.style.display = "block";

          playSong();

          createConfetti();

        }

      }, 1000);

    }


    function playSong() {

      song.currentTime = 0;

      song.play().catch(error => {

        console.log("Audio could not start:", error);

      });

    }


    function createConfetti() {

      const emojis = [
        "🎉",
        "🎈",
        "✨",
        "🎊",
        "🥳",
        "🎂"
      ];

      for (let i = 0; i < 60; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.animationDelay =
          Math.random() * 2 + "s";

        document.body.appendChild(confetti);

      }

    }

  </script>

</body>
</html>
