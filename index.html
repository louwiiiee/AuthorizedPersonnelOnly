<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎂 Birthday Surprise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    #start {
      flex-direction: column;
      cursor: pointer;
    }

    #start .cake {
      font-size: 90px;
    }

    #start h1 {
      font-size: 35px;
      margin: 15px 0;
    }

    #start p {
      font-size: 20px;
    }

    #countdown {
      display: none;
      font-size: 45vw;
      font-weight: bold;
      text-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    #birthday {
      display: none;
      flex-direction: column;
      animation: pop .8s ease;
    }

    #birthday h1 {
      font-size: 12vw;
      margin: 0;
      line-height: 1.1;
    }

    #birthday p {
      font-size: 6vw;
    }

    #photo {
      display: none;
      width: min(70vw, 350px);
      max-height: 35vh;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }

    .confetti {
      position: fixed;
      top: -40px;
      z-index: 100;
      font-size: 30px;
      pointer-events: none;
      animation: fall 4s linear forwards;
    }

    @keyframes pop {
      0% {
        transform: scale(0);
      }

      70% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <!-- START SCREEN -->

  <div id="start" class="screen" onclick="startSurprise()">

    <div class="cake">🎂</div>

    <h1>Someone has a surprise for you...</h1>

    <p>👆 Tap anywhere to continue</p>

  </div>


  <!-- COUNTDOWN -->

  <div id="countdown" class="screen">
    10
  </div>


  <!-- BIRTHDAY -->

  <div id="birthday" class="screen">

    <img id="photo" src="fts.jpg">

    <h1>🎉 HAPPY BIRTHDAY! 🎉</h1>

    <p>🥳 Have an amazing day! 🎂</p>

  </div>


  <!-- YOUR SONG -->

  <audio id="song" src="birthday.mp3"></audio>


  <script>

    function startSurprise() {

      const start = document.getElementById("start");
      const countdown = document.getElementById("countdown");
      const birthday = document.getElementById("birthday");
      const photo = document.getElementById("photo");
      const song = document.getElementById("song");

      // Hide start screen
      start.style.display = "none";

      // Show countdown
      countdown.style.display = "flex";

      // Start music after the user taps
      song.play().catch(function(error) {
        console.log("Music error:", error);
      });

      let number = 10;

      countdown.textContent = number;

      const timer = setInterval(function() {

        number--;

        if (number > 0) {

          countdown.textContent = number;

        } else {

          clearInterval(timer);

          // Hide countdown
          countdown.style.display = "none";

          // Show birthday
          birthday.style.display = "flex";

          // Show photo
          photo.style.display = "block";

          // Confetti
          createConfetti();

        }

      }, 1000);

    }


    function createConfetti() {

      const emojis = [
        "🎉",
        "🎈",
        "🎊",
        "✨",
        "🥳",
        "🎂",
        "💖"
      ];

      for (let i = 0; i < 80; i++) {

        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        piece.style.left =
          Math.random() * 100 + "vw";

        piece.style.animationDelay =
          Math.random() * 2 + "s";

        piece.style.fontSize =
          (20 + Math.random() * 25) + "px";

        document.body.appendChild(piece);

      }

    }

  </script>

</body>
</html>
