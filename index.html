<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Surprise 🎂</title>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #start h1 {
      font-size: 70px;
      margin: 10px;
    }

    #start p {
      font-size: 22px;
    }

    #message {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
      pointer-events: none;
    }

    #countdown {
      font-size: 35vw;
      font-weight: bold;
      text-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    #birthday {
      display: none;
    }

    #birthday h1 {
      font-size: 11vw;
      margin: 0;
    }

    #birthday p {
      font-size: 5vw;
    }

    .confetti {
      position: fixed;
      top: -30px;
      font-size: 30px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <div id="start">
    <h1>🎂</h1>
    <p><strong>Birthday Surprise</strong></p>
    <p>Tap to open the camera 👆</p>
  </div>

  <div id="message">

    <div id="countdown">10</div>

    <div id="birthday">
      <h1>🎉 HAPPY BIRTHDAY! 🎉</h1>
      <p>🎂 Have an amazing day! 🎈</p>
    </div>

  </div>

  <audio id="song" src="birthday.mp3"></audio>

  <script>

    const startScreen = document.getElementById("start");
    const message = document.getElementById("message");
    const countdown = document.getElementById("countdown");
    const birthday = document.getElementById("birthday");
    const song = document.getElementById("song");

    let surpriseStarted = false;

    startScreen.addEventListener("click", async function() {

      startScreen.style.display = "none";

      try {

        const mindarThree = new MindARThree({
          container: document.body,
          imageTargetSrc: "./targets.mind",
          maxTrack: 1
        });

        const renderer = mindarThree.renderer;
        const scene = mindarThree.scene;
        const camera = mindarThree.camera;

        const anchor = mindarThree.addAnchor(0);

        anchor.onTargetFound = function() {

          if (!surpriseStarted) {

            surpriseStarted = true;

            startCountdown();

          }

        };

        anchor.onTargetLost = function() {
          console.log("Target lost");
        };

        await mindarThree.start();

        renderer.setAnimationLoop(function() {

          renderer.render(scene, camera);

        });

      } catch (error) {

        console.error(error);

        document.body.innerHTML = `
          <div style="
            color:white;
            background:#222;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-family:Arial;
            padding:30px;
          ">
            <div>
              <h1>Camera couldn't start 😭</h1>
              <p>Please allow camera access and reload.</p>
            </div>
          </div>
        `;

      }

    });


    function startCountdown() {

      message.style.display = "flex";

      let number = 10;

      countdown.textContent = number;

      const timer = setInterval(function() {

        number--;

        if (number > 0) {

          countdown.textContent = number;

        } else {

          clearInterval(timer);

          countdown.style.display = "none";

          birthday.style.display = "block";

          song.play();

          createConfetti();

        }

      }, 1000);

    }


    function createConfetti() {

      const emojis = [
        "🎉",
        "🎈",
        "✨",
        "🎊",
        "🥳",
        "🎂"
      ];

      for (let i = 0; i < 60; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.animationDelay =
          Math.random() * 2 + "s";

        document.body.appendChild(confetti);

      }

    }

  </script>

</body>
</html>
