<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Surprise 🎂</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #061a40;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;

      background:
        linear-gradient(
          135deg,
          #061a40,
          #0077b6
        );

      cursor: pointer;
    }

    #start h1 {
      font-size: 70px;
      margin: 0 0 20px;
    }

    #start p {
      font-size: 22px;
    }

    #countdown {
      position: fixed;
      inset: 0;
      z-index: 5000;

      display: none;

      justify-content: center;
      align-items: center;

      color: white;
      font-size: 45vw;
      font-weight: bold;

      background: rgba(0,60,130,.4);

      text-shadow: 0 5px 20px rgba(0,0,0,.5);
    }

    #birthday {
      position: fixed;
      inset: 0;
      z-index: 5000;

      display: none;

      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;

      padding: 20px;

      background:
        linear-gradient(
          135deg,
          rgba(6,26,64,.95),
          rgba(0,119,182,.95)
        );
    }

    #birthday img {
      width: 60vw;
      max-width: 350px;
      max-height: 35vh;

      object-fit: contain;

      border-radius: 20px;

      margin-bottom: 20px;

      box-shadow:
        0 10px 40px rgba(0,0,0,.4);
    }

    #birthday h1 {
      font-size: 11vw;
      margin: 0;
    }

    #birthday p {
      font-size: 5vw;
    }

    .confetti {
      position: fixed;
      top: -40px;
      z-index: 10000;

      font-size: 30px;

      animation:
        fall 4s linear forwards;
    }

    @keyframes fall {

      to {
        transform:
          translateY(110vh)
          rotate(720deg);
      }

    }

  </style>

</head>

<body>


<!-- START SCREEN -->

<div id="start">

  <h1>🎂</h1>

  <p>
    <strong>Birthday Surprise</strong>
  </p>

  <p>
    Tap to start the surprise 👆
  </p>

</div>


<!-- COUNTDOWN -->

<div id="countdown">
  10
</div>


<!-- BIRTHDAY -->

<div id="birthday">

  <img
    src="fts.jpg"
    alt="Birthday photo"
  >

  <h1>
    🎉 HAPPY BIRTHDAY! 🎉
  </h1>

  <p>
    🎂 Have an amazing day! 🎈
  </p>

</div>


<!-- SONG -->

<audio
  id="song"
  src="birthday.mp3"
  preload="auto">
</audio>


<!-- =========================
     MINDAR CAMERA
     ========================= -->

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    maxTrack: 1;
  "
  embedded
  color-space="sRGB"
  renderer="
    colorManagement: true;
    physicallyCorrectLights;
  "
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <a-entity
    mindar-image-target="targetIndex: 0">
  </a-entity>

</a-scene>


<script>


/* =========================
   ELEMENTS
   ========================= */

const start =
  document.getElementById("start");

const countdown =
  document.getElementById("countdown");

const birthday =
  document.getElementById("birthday");

const song =
  document.getElementById("song");


let surpriseStarted = false;


/* =========================
   START BUTTON
   ========================= */

start.addEventListener(
  "click",
  function() {

    /*
     * Hide the start screen.
     *
     * MindAR is already initialized
     * by the A-Frame scene.
     */

    start.style.display = "none";

  }
);


/* =========================
   IMAGE TARGET
   ========================= */

const target =
  document.querySelector(
    '[mindar-image-target="targetIndex: 0"]'
  );


/* =========================
   IMAGE FOUND
   ========================= */

target.addEventListener(
  "targetFound",
  function() {

    console.log(
      "🎯 FTS IMAGE FOUND!"
    );


    if (!surpriseStarted) {

      surpriseStarted = true;

      startCountdown();

    }

  }
);


/* =========================
   COUNTDOWN
   ========================= */

function startCountdown() {


  countdown.style.display =
    "flex";


  let number = 10;


  countdown.textContent =
    number;


  const timer =
    setInterval(
      function() {


        number--;


        if (number > 0) {

          countdown.textContent =
            number;

        }


        else {

          clearInterval(timer);


          countdown.style.display =
            "none";


          birthday.style.display =
            "flex";


          /*
           * Start the song
           */

          song.currentTime = 0;


          song.play().catch(
            function(error) {

              console.log(
                "Song could not play:",
                error
              );

            }
          );


          /*
           * Confetti
           */

          createConfetti();

        }

      },
      1000
    );

}


/* =========================
   CONFETTI
   ========================= */

function createConfetti() {


  const emojis = [

    "🎉",
    "🎈",
    "🎊",
    "✨",
    "🥳",
    "🎂",
    "💙",
    "⭐"

  ];


  for (
    let i = 0;
    i < 80;
    i++
  ) {


    const piece =
      document.createElement("div");


    piece.className =
      "confetti";


    piece.textContent =
      emojis[
        Math.floor(
          Math.random() *
          emojis.length
        )
      ];


    piece.style.left =
      Math.random() *
      100 +
      "vw";


    piece.style.animationDelay =
      Math.random() *
      2 +
      "s";


    piece.style.fontSize =
      (
        20 +
        Math.random() *
        25
      ) +
      "px";


    document.body.appendChild(
      piece
    );

  }

}

</script>


</body>
</html>
